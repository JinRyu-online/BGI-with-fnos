<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BetterGI Trigger — NAS 应用</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <style>
    :root {
      --brand: #5b8def;
      --brand-d: #3a6fd8;
      --green: #2a9d8f;
      --red: #e76f51;
      --amber: #e9c46a;
    }
    /* ---------- 全局 ---------- */
    main { max-width: 860px; padding-top: 1.5rem; }
    h1 { font-size: 1.6rem; margin-bottom: .25rem; }
    .subtitle { color: var(--pico-muted-color); margin-top: 0; }

    /* ---------- 卡片 ---------- */
    .card {
      background: var(--pico-card-background-color, #fff);
      border: 1px solid var(--pico-card-border-color, #e5e7eb);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      margin: 1rem 0;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .card h2 {
      font-size: 1.05rem;
      margin: 0 0 .75rem;
      display: flex; align-items: center; gap: .4rem;
    }
    .card h2 .badge {
      font-size: .7rem; font-weight: 500;
      padding: .15rem .55rem; border-radius: 999px;
      background: var(--pico-secondary-background);
    }

    /* ---------- 按钮 ---------- */
    .btn { display:inline-flex; align-items:center; gap:.35rem; }
    .btn-row { display:flex; gap:.5rem; flex-wrap: wrap; align-items:center; }
    button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    button.primary:hover { background: var(--brand-d); border-color: var(--brand-d); }
    button.tiny { padding: .3rem .65rem; font-size: .8rem; }

    /* ---------- 设备 / 任务 条目 ---------- */
    .device-row, .task-row, .job-row {
      display: flex; gap: .6rem; align-items: center; justify-content: space-between;
      padding: .55rem .85rem; margin: .35rem 0;
      border: 1px solid #eef0f3; border-radius: 8px;
      background: #fafbfc;
      transition: background .15s;
    }
    .device-row:hover { background: #f3f6ff; border-color: #d4deff; }
    .device-row .meta, .task-row .meta { flex: 1; }
    .device-row .name { font-weight: 600; }
    .device-row .sub { color: var(--pico-muted-color); font-size: .8rem; }

    /* ---------- 状态标签 ---------- */
    .tag {
      font-size:.75rem; font-weight:600;
      padding:.2rem .55rem; border-radius:999px;
      white-space: nowrap;
    }
    .tag.idle { background:#eef0f3; color:#6b7280; }
    .tag.running { background:#fff3cd; color:#92760b; }
    .tag.completing { background:#d1fae5; color:#065f46; }
    .tag.done { background:#d1fae5; color:#065f46; }
    .tag.timed_out { background:#fef3c7; color:#92400e; }
    .tag.abnormal_exit { background:#fee2e2; color:#991b1b; }
    .tag.failed, .tag.aborted { background:#fee2e2; color:#991b1b; }
    .tag.ok { background:#d1fae5; color:#065f46; }
    .tag.err { background:#fee2e2; color:#991b1b; }
    .tag.paired { background:#dbeafe; color:#1e40af; }

    /* ---------- 提示 ---------- */
    .hint { font-size: .85rem; color: var(--pico-muted-color); }
    .empty { text-align:center; color: var(--pico-muted-color); padding: 1.5rem 0; }

    /* ---------- 卡片内提示区 ---------- */
    .alert { padding: .65rem .85rem; border-radius: 8px; font-size: .85rem; margin: .5rem 0; }
    .alert.info { background:#eff6ff; color:#1e40af; border:1px solid #dbeafe; }
    .alert.warn { background:#fffbeb; color:#92400e; border:1px solid #fef3c7; }
    .alert.err { background:#fef2f2; color:#991b1b; border:1px solid #fee2e2; }
    .alert.ok { background:#ecfdf5; color:#065f46; border:1px solid #d1fae5; }

    /* 任务分组链 / 任务属性 */
    .groups { display:flex; flex-wrap:wrap; gap:.25rem; align-items:center; margin:.35rem 0 .2rem; }
    .g-step { font-size:.72rem; padding:.15rem .45rem; border-radius:6px; background:#eef0f3; color:#374151; }
    .g-step.last { background:#dbeafe; color:#1e40af; font-weight:600; }
    .g-arrow { color:#9ca3af; font-size:.7rem; }
    .task-props { display:flex; flex-direction:column; gap:.45rem; margin-top:.35rem; }
    .task-prop-row { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; }
    .prop-pill { display:inline-flex; align-items:center; gap:.3rem; font-size:.78rem; font-weight:600; padding:.35rem .75rem; border:1px solid transparent; border-radius:8px; white-space:nowrap; }
    .prop-pill .prop-emoji { font-size:.9rem; }
    .prop-pill.time { background:#eff6ff; color:#1d4ed8; border-color:#bfdbfe; }
    .prop-pill.after { background:#f0fdf4; color:#065f46; border-color:#bbf7d0; }
    .prop-pill.id   { background:#f8fafc; color:#475569; border-color:#e2e8f0; font-weight:500; font-family:ui-monospace, SFMono-Regular, monospace; font-size:.74rem; }
    .task-id-col { flex-shrink:0; display:flex; align-items:flex-start; padding-top:.1rem; }
    .task-title { font-weight:700; font-size:1rem; color:#1e293b; }
    .task-subtitle { font-size:.8rem; color:#64748b; margin-top:.15rem; }
    .task-row { gap:1rem; }
    .job-row { gap:.75rem; align-items:center; }
    .task-name-badge { display:inline-block; font-size:.82rem; font-weight:600; padding:.3rem .7rem; background:#f8fafc; color:#475569; border:1px solid #e2e8f0; border-radius:8px; font-family:ui-monospace, SFMono-Regular, monospace; }
    .task-id { display:none; }  /* 不再单独显示 id,已合并进名称气泡 */
    .job-field { display:flex; gap:.5rem; align-items:center; }
    .job-field-label { display:inline-block; min-width:4.5rem; font-size:.78rem; color:#64748b; font-weight:500; }
    .job-field-val { font-size:.85rem; color:#1e293b; font-weight:600; }
    .job-field-name { color:#1d4ed8; }
    /* ---------- 状态卡：实时日志面板(单活 job 专属) ---------- */
    .live-log { margin-top:1rem; background:#0b1220; border:1px solid #1e293b; border-radius:10px; overflow:hidden; }
    .live-log-head { display:flex; align-items:center; gap:.6rem; padding:.5rem .8rem; background:#0f172a; border-bottom:1px solid #1e293b; font-size:.78rem; color:#94a3b8; }
    .live-log-head .job-id { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:#64748b; }
    .live-log-head .spacer { flex:1; }
    .live-log-head .count { color:#64748b; }
    .live-log-pre { margin:0; padding:.55rem .8rem; height:260px; overflow-y:auto; font-size:.74rem; line-height:1.55; color:#cbd5e1; white-space:pre-wrap; word-break:break-all; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; scroll-behavior:smooth; }
    .live-log-pre .log-line { display:block; padding:.04rem 0; border-bottom:1px solid rgba(255,255,255,.04); }
    .live-log-pre .log-line.kw { color:#fbbf24; font-weight:600; }            /* 完成关键字 */
    .live-log-pre .log-line.err { color:#f87171; }                              /* 异常 */
    .live-log-pre .log-line.sys { color:#22d3ee; }                              /* 系统消息 */
    .live-log-foot { display:flex; align-items:center; gap:.5rem; padding:.5rem .8rem; background:#0f172a; border-top:1px solid #1e293b; }
    .live-log-foot .spacer { flex:1; }
    .live-log-reason { font-size:.78rem; font-weight:600; padding:.2rem .6rem; border-radius:999px; }
    .live-log-reason.ok { background:#052e16; color:#4ade80; border:1px solid #166534; }
    .live-log-reason.err { background:#450a0a; color:#fca5a5; border:1px solid #7f1d1d; }
    .ws-dot { display:inline-block; width:.5rem; height:.5rem; border-radius:50%; margin-right:.3rem; background:#64748b; }
    .ws-dot.connecting { background:#eab308; animation:pulse 1s infinite; }
    .ws-dot.connected { background:#22c55e; }
    .ws-dot.error { background:#ef4444; }
    .ws-dot.closed { background:#64748b; }
    button.danger { background:#dc2626; border-color:#dc2626; color:#fff; }
    button.danger:hover { background:#b91c1c; border-color:#b91c1c; }
    .status-card .status-row { display:flex; align-items:center; gap:.8rem; }
    .status-indicator { width:.9rem; height:.9rem; border-radius:50%; background:#cbd5e1; flex-shrink:0; animation:none; }
    .status-indicator.is-idle { background:#cbd5e1; }
    .status-indicator.is-running { background:#f59e0b; animation:pulse 1.5s infinite; }
    .status-indicator.is-completing { background:#3b82f6; animation:pulse 1.5s infinite; }
    .status-indicator.is-done { background:#22c55e; }
    .status-indicator.is-timed_out { background:#f97316; }
    .status-indicator.is-abnormal_exit { background:#ef4444; }
    .status-indicator.is-failed, .status-indicator.is-aborted { background:#ef4444; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.4;} }
    .status-text { display:flex; align-items:baseline; gap:.35rem; flex-wrap:wrap; }
    .status-text .tag { font-size:.95rem; padding:.35rem .85rem; }
    .status-detail { font-size:.85rem; color:#64748b; }
    .status-meta { margin-top:.6rem; font-size:.8rem; color:#64748b; }
    .status-meta:empty { display:none; }
    .job-timer { margin-top:.2rem; color:#6b7280; }
  </style>
</head>
<body>
<main class="container">
  <header style="margin-bottom: 1rem;">
    <h1><img src="/static/bgi_icon.png" alt="" style="width:1.4em;height:1.4em;vertical-align:-.25em;margin-right:.35em;border-radius:6px;">BetterGI Trigger</h1>
    <p class="subtitle">通过飞牛 NAS 远程触发 Windows 端 BetterGI 执行自动化任务</p>
  </header>

  <!-- ===== 当前目标卡 ===== -->
  <section class="card">
    <h2>📡 当前目标 <span id="target-badge" class="badge">未配对</span></h2>
    <p id="target-info">加载中…</p>
    <div class="btn-row">
      <button id="btn-unpair" class="outline secondary" hidden>取消配对</button>
    </div>
  </section>

  <!-- ===== 扫描卡 ===== -->
  <section class="card">
    <h2>🔍 扫描设备</h2>
    <p class="hint">扫描局域网内的 BetterGI 监听器（首次使用点这里）。自动扫描常见网段，无需手动指定。</p>
    <div class="btn-row">
      <button id="btn-scan" class="primary btn">🔍 自动扫描</button>
      <button id="btn-cancel" class="outline secondary btn tiny" hidden>⏹ 停止扫描</button>
    </div>
    <details style="margin-top:.75rem;">
      <summary class="hint" style="cursor:pointer;">高级：手动指定 IP / 子网</summary>
      <div style="margin-top:.5rem; display:flex; flex-direction:column; gap:.4rem;">
        <div class="btn-row">
          <input id="scan-ip" type="text" placeholder="单 IP，如 192.168.31.43">
          <button id="btn-scan-ip" class="outline btn tiny">扫这一个 IP</button>
        </div>
        <div class="btn-row">
          <input id="scan-subnet" type="text" placeholder="子网 CIDR，如 192.168.31.0/24">
          <button id="btn-scan-subnet" class="outline btn tiny">按子网扫描</button>
        </div>
      </div>
    </details>
    <p id="scan-empty-hint" class="alert warn" hidden>
      未发现监听器？请确认 Windows 监听器已启动、并在上方手动指定子网 CIDR（如 <code>192.168.31.0/24</code>）重试。
    </p>
    <div id="scan-result"></div>
    <div id="pair-form" hidden style="margin-top:.75rem;">
      <p id="pair-info" class="alert info"></p>
      <div class="btn-row">
        <button id="btn-pair" class="primary btn">确认配对</button>
      </div>
    </div>
  </section>

  <!-- ===== 任务卡 ===== -->
  <section class="card">
    <h2>⚡ 任务 <span id="task-count" class="badge">0</span></h2>
    <div class="btn-row" style="margin-bottom:.5rem;">
      <button id="btn-load-tasks" class="outline btn tiny">刷新</button>
    </div>
    <div id="tasks"><p class="empty">尚未配对或无任务</p></div>
  </section>

  <!-- ===== 运行状态卡 ===== -->
  <section class="card status-card">
    <div class="status-row">
      <div class="status-indicator" id="status-indicator"></div>
      <div class="status-text">
        <span id="run-status" class="tag idle">空闲</span>
        <span id="status-detail" class="status-detail"></span>
      </div>
    </div>
    <div id="status-meta" class="status-meta"></div>

    <!-- ★ 实时日志面板:单活 job 专属,运行/收尾时展开 -->
    <div id="live-log" class="live-log" hidden>
      <div class="live-log-head">
        <span class="ws-dot connecting" id="ll-dot"></span>
        <span id="ll-status">连接中…</span>
        <span class="job-id" id="ll-jobid"></span>
        <span class="spacer"></span>
        <span class="count" id="ll-count">0 行</span>
      </div>
      <pre class="live-log-pre" id="ll-pre"><span class="log-line sys">▶ 触发任务后,此处实时显示 BetterGI 日志…</span></pre>
      <div class="live-log-foot">
        <span id="ll-reason" class="live-log-reason" hidden></span>
        <span class="spacer"></span>
        <button id="btn-abort" class="danger btn tiny" hidden>⏹ 中止(跳过收尾)</button>
      </div>
    </div>
  </section>

  <!-- ===== 历史卡 ===== -->
  <section class="card">
    <h2>📜 运行历史</h2>
    <div class="btn-row" style="margin-bottom:.5rem;">
      <button id="btn-load-jobs" class="outline btn tiny">刷新</button>
    </div>
    <div id="jobs"><p class="empty">暂无历史</p></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);

async function api(method, path, body) {
  const opt = { method, headers: {} };
  if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || (`HTTP ${r.status}`));
  return data;
}

// 当前目标
async function refreshTarget() {
  try {
    const cfg = await api('GET', '/api/config');
    const t = cfg.default_target;
    if (t) {
      $('target-info').innerHTML = `<span class="name">${t.hostname || t.ip}</span><br><span class="sub">${t.ip}:${t.port}</span>`;
      $('target-badge').textContent = '已配对';
      $('target-badge').className = 'tag paired';
      $('btn-unpair').hidden = false;
    } else {
      $('target-info').innerHTML = '<p class="empty">尚未配对，请先“扫描设备”</p>';
      $('target-badge').textContent = '未配对';
      $('target-badge').className = 'tag idle';
      $('btn-unpair').hidden = true;
    }
  } catch (e) { $('target-info').innerHTML = `<p class="alert err">读取配置失败：${e.message}</p>`; }
}

// 扫描模式: 'auto'(plan 给全部,包括 COMMON fallback) / 'subnet'(仅扫指定 CIDR)
let pollTimer = null;

// 子网状态小卡片
function renderSubnetRow(s) {
  const icon = s.status === 'done' ? (s.found ? '✅' : '⬜')
              : s.status === 'scanning' ? '🔄'
              : s.status === 'skipped' ? '⏭' : '⏳';
  const statusTxt = s.status === 'done' ? (s.found ? `发现 ${s.found} 台` : '无设备')
                  : s.status === 'scanning' ? '扫描中…'
                  : s.status === 'skipped' ? '跳过' : '等待';
  return `<div class="subnet-row" style="display:flex;gap:.5rem;align-items:center;padding:.3rem .5rem;border:1px solid #eef0f3;border-radius:6px;margin:.2rem 0;background:#fafbfc;">
    <span>${icon}</span>
    <code style="flex:1;font-size:.85rem;">${s.subnet}</code>
    <span class="hint" style="font-size:.75rem;">${statusTxt}</span>
  </div>`;
}

// 进度条 + 子网列表整体渲染
function renderProgressUI(snap) {
  const pct = snap.total_ips > 0 ? Math.min(100, Math.round(snap.scanned_ips / snap.total_ips * 100)) : 0;
  const bar = `<div style="background:#eef0f3;border-radius:99px;height:.6rem;overflow:hidden;margin:.5rem 0;">
    <div style="background:var(--brand);height:100%;width:${pct}%;transition:width .3s;"></div>
  </div>`;
  const stat = `<p class="hint" style="margin:.25rem 0;">已扫 ${snap.scanned}/${snap.total} 个子网 · 约 ${snap.scanned_ips}/${snap.total_ips} IP · 用时 ${snap.elapsed.toFixed(1)}s</p>`;
  const subnetList = snap.subnets.map(renderSubnetRow).join('');
  const foundDevices = snap.devices.length
    ? `<p class="hint" style="margin-top:.5rem;">已发现 <strong>${snap.devices.length}</strong> 台：${snap.devices.map(d=>(`${d.hostname||'?'} (${d.ip})`)).join('、')}</p>`
    : '';
  $('scan-result').innerHTML = `${bar}${stat}${subnetList}${foundDevices}`;
}

// 扫描: 启动后台任务 → 轮询进度 → 完成时渲染可点选的卡片
async function runScan() {
  setScanRunning(true);
  $('scan-empty-hint').hidden = true;
  const subnet = $('scan-subnet').value.trim();
  // 停止任何旧轮询
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  try {
    const ack = await api('POST', '/api/scan', subnet ? { subnet } : undefined);
    if (!ack.started) { $('scan-result').innerHTML = `<p class="alert warn">扫描未启动：${ack.reason}</p>`; return; }
    // 立即显示一次,然后进入轮询
    const first = await api('GET', '/api/scan-progress');
    renderProgressUI(first);
    pollTimer = setInterval(async () => {
      try {
        const snap = await api('GET', '/api/scan-progress');
        if (!snap.active) {
          clearInterval(pollTimer); pollTimer = null;
          finishScan(snap);
          return;
        }
        renderProgressUI(snap);
        // 中途已发现设备,底部实时展示可点选卡
        if (snap.devices.length) {
          const devsHtml = `<div style="margin-top:.75rem;">${snap.devices.map(d =>
            `<div class="device-row">
              <div class="meta"><div class="name">${d.hostname || '(未知主机)'}</div>
                <div class="sub">${d.ip}:${d.port} ${d.version ? '· v' + d.version : ''}</div></div>
              <button class="outline btn tiny" data-ip="${d.ip}" data-port="${d.port}" data-host="${d.hostname||''}">选择</button>
            </div>`).join('')}</div>`;
          // 仅在进度子网列表后面挂一个临时设备选区
          const tmp = $('#scan-result .dev-floating');
          if (tmp) tmp.remove();
          const el = document.createElement('div');
          el.className = 'dev-floating';
          el.innerHTML = `<p class="hint" style="margin-top:.5rem;">⬇ 发现设备(可立即选择)</p>${devsHtml}`;
          $('scan-result').appendChild(el);
          el.querySelectorAll('button').forEach(b => b.onclick = () => selectDevice(b.dataset));
        }
      } catch (e) { /* 暂略 */ }
    }, 800);
  } catch (e) { $('scan-result').innerHTML = `<p class="alert err">启动扫描失败：${e.message}</p>`; }
}

// 扫描完成后的静态展示
function finishScan(snap) {
  setScanRunning(false);                                          // 重置按钮状态
  if (snap.error) { $('scan-result').innerHTML = `<p class="alert err">扫描出错：${snap.error}</p>`; return; }
  if (!snap.devices.length) {
    $('scan-result').innerHTML = '<p class="alert warn">未发现 BetterGI 监听器。</p>';
    $('scan-empty-hint').hidden = false;
    return;
  }
  $('scan-result').innerHTML = `<p class="hint" style="margin-bottom:.5rem;">扫描完成，用时 ${snap.elapsed.toFixed(1)}s，发现 ${snap.devices.length} 台：</p>`
    + snap.devices.map(d =>
      `<div class="device-row">
        <div class="meta"><div class="name">${d.hostname || '(未知主机)'}</div>
          <div class="sub">${d.ip}:${d.port} ${d.version ? '· v' + d.version : ''}</div></div>
        <button class="outline btn tiny" data-ip="${d.ip}" data-port="${d.port}" data-host="${d.hostname||''}">选择</button>
      </div>`).join('');
  document.querySelectorAll('#scan-result .device-row button').forEach(b =>
    b.onclick = () => selectDevice(b.dataset));
}

// 运行时切换"扫描中"按钮/取消按钮的显隐
function setScanRunning(running) {
  $('btn-scan').disabled = running;
  $('btn-cancel').hidden = !running;
}
// 单 IP 扫描：把 192.168.31.43 包装为 192.168.31.43/32 走子网扫描接口
function scanSingleIp() {
  const ip = $('scan-ip').value.trim();
  if (!ip) { alert('请先输入 IP'); return; }
  // 自动补 /32
  const cidr = ip.includes('/') ? ip : `${ip}/32`;
  // 复用 runScan 但临时把值塞进 scan-subnet
  const subnetInput = $('scan-subnet');
  const prev = subnetInput.value;
  subnetInput.value = cidr;
  runScan();
  subnetInput.value = prev;   // 还原,不影响用户下次输入
}
$('btn-scan-ip').onclick = scanSingleIp;

// 按钮事件绑定
$('btn-scan').onclick = runScan;
$('btn-scan-subnet').onclick = runScan;
$('btn-cancel').onclick = () => {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  if ($('scan-result')) $('scan-result').innerHTML += '<p class="alert info">已请求停止。</p>';
  setScanRunning(false);
};
let selected = null;

// 选择设备：通过 NAS 后端同源 HTTPS API 拉取 /key，避免浏览器 mixed content 拦截
async function selectDevice(dev) {
  selected = dev;
  $('pair-form').hidden = false;
  $('pair-info').className = 'alert info';
  $('pair-info').innerHTML = '🔄 正在获取配对信息…';
  $('btn-pair').disabled = true;
  try {
    // 关键：走同源后端 /api/discover-key 代理, 不直连 http://Windows:port
    const data = await api('GET', `/api/discover-key?ip=${encodeURIComponent(dev.ip)}&port=${dev.port}`);
    if (!data.api_key) {
      $('pair-info').className = 'alert err';
      $('pair-info').innerHTML = `❌ 无法获取密钥：${data.detail || 'no api_key'}`;
      return;
    }
    selected.api_key = data.api_key;
    selected.host = data.hostname || dev.host || '';
    $('pair-info').className = 'alert ok';
    $('pair-info').innerHTML = `✅ 已就绪：<strong>${selected.host}</strong> @ ${dev.ip}:${dev.port}`;
    $('btn-pair').disabled = false;
  } catch (e) {
    $('pair-info').className = 'alert err';
    $('pair-info').innerHTML = `❌ 无法连接设备：${e.message}`;
  }
}

// 配对（使用自动填充的 api_key，无需用户手输）
$('btn-pair').onclick = async () => {
  if (!selected) return;
  try {
    await api('POST', '/api/pair', { ip: selected.ip, port: +selected.port, hostname: selected.host, api_key: selected.api_key });
    // ★ 配对成功后注入 Windows 主机信息,供日志 WS 直连(不经 NAS 中转)
    setLogTarget(selected.ip, +selected.port);
    $('pair-form').hidden = true;
    await refreshTarget();
    await loadTasks();
  } catch (e) { alert('配对失败：' + e.message); }
};

// 取消配对
$('btn-unpair').onclick = async () => {
  await api('POST', '/api/unpair');
  await refreshTarget();
  $('task-count').textContent = '0';
  $('tasks').innerHTML = '<p class="empty">尚未配对</p>';
};

// 任务列表（分区字段展示 · 分组链 · 计时 · 收尾动作）
async function loadTasks() {
  try {
    const tasks = await api('GET', '/api/tasks');
    $('task-count').textContent = tasks.length;
    if (!tasks.length) { $('tasks').innerHTML = '<p class="empty">无任务</p>'; return; }
    const afterLabel = { sleep: '💤 休眠', shutdown: '⏻ 关机', lock: '🔒 锁屏', none: '⏸ 不操作' };
    const w=_w();  // Windows listener IP/端口(由 /api/config 提供后注入)
    $('tasks').innerHTML = tasks.map(t => `
      <div class="task-row" data-task-id="${t.id}">
        <div class="meta">
          <div class="task-name-badge">${t.display_name}</div>
          <div class="task-id">${t.id}</div>
          <div class="groups">${t.groups.map((g,i)=>`<span class="g-step${i===t.groups.length-1?' last':''}">${g}</span>`).join('<span class="g-arrow">→</span>')}</div>
          <div class="task-props">
            <div class="task-prop-row">
              <span class="prop-pill time"><span class="prop-emoji">⏱</span>执行 ${t.timeout_min}分钟</span>
            </div>
            <div class="task-prop-row">
              <span class="prop-pill after">${afterLabel[t.after_done] || t.after_done}</span>
            </div>
          </div>
        </div>
        <button class="primary btn tiny" data-id="${t.id}" title="触发任务">▶ 执行</button>
      </div>`).join('');
    document.querySelectorAll('#tasks .task-row button[data-id]').forEach(b =>
      b.onclick = () => trigger(b.dataset.id));
  } catch (e) { $('tasks').innerHTML = `<p class="alert err">加载失败：${e.message}</p>`; $('task-count').textContent = '!'; }
}
$('btn-load-tasks').onclick = loadTasks;

// 触发 + 轮询（pollTimer 已在扫描区声明，此处置 null 清理）
pollTimer = null;
async function trigger(taskId) {
  try {
    const { job_id, display_name } = await api('POST', '/api/trigger', { task_id: taskId });
    setRunStatus('running', '运行中', display_name || '任务已触发');
    setJobMeta(`任务ID <code>${job_id}</code> · 启动时间 ${fmtTimeStr(Date.now()/1000)}`);
    showLiveLog(job_id);
    connectLogWS(job_id);
    pollStatus(job_id, Date.now());
  } catch (e) { setRunStatus('failed', '失败', e.message); setJobMeta(null); }
}
function fmtTimeStr(ts) {
  const d = new Date((ts || 0) * 1000);
  return d.toLocaleTimeString('zh-CN', { hour12: false });
}
function setRunStatus(kind, text, detail) {
  const tag = $('run-status');
  tag.className = 'tag ' + kind;
  tag.textContent = text;
  // 指标点颜色
  const ind = $('status-indicator');
  ind.className = 'status-indicator is-' + kind;
  // 中止按钮:仅 completing(反悔窗口)露出
  $('btn-abort').hidden = (kind !== 'completing');
  // 副标题(可选)
  if (detail !== undefined) {
    $('status-detail').textContent = detail ? '  ·  ' + detail : '';
  }
}
function setJobMeta(html) {
  const el = $('status-meta');
  if (html) { el.innerHTML = html; el.style.display = ''; }
  else { el.innerHTML = ''; el.style.display = 'none'; }
}
function pollStatus(jobId, startedMs) {
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try {
      const st = await api('GET', '/api/status?job_id=' + jobId);
      const stateText = { running: '运行中', completing: '收尾中（可中止）', done: '已完成',
                          timed_out: '超时', abnormal_exit: '游戏异常退出', failed: '失败', aborted: '已中止' };
      const reasonZh = { game_exited:'游戏退出', log_keyword:'日志关键字命中', timeout:'超时', error:'执行错误', aborted:'用户中止' };
      const stateDetail = st.completion_reason ? `（${reasonZh[st.completion_reason] || st.completion_reason}）` : '';
      const elapsedSec = startedMs ? Math.floor((Date.now() - startedMs) / 1000) : null;
      const elapsedTxt = elapsedSec != null ? `${elapsedSec}s` : '';
      setRunStatus(st.state, stateText[st.state] || st.state, stateDetail);
      setJobMeta(`任务ID <code>${jobId}</code>${elapsedTxt ? ' · 已运行 ' + elapsedTxt : ''}`);
      const terminal = ['done','timed_out','abnormal_exit','failed','aborted'].includes(st.state);
      if (terminal) {
        clearInterval(pollTimer);
        const finalElapsed = startedMs ? ` · 总耗时 ${Math.floor((Date.now()-startedMs)/1000)}s` : '';
        setRunStatus(st.state, stateText[st.state] || st.state, stateDetail + finalElapsed);
        setJobMeta(`任务ID <code>${jobId}</code>${finalElapsed}`);
        loadJobs();
      }
    } catch (e) { /* 暂时错误，继续轮询 */ }
  }, 10000);
}

// 历史（可读格式 · 状态中文 · 字段标签）
async function loadJobs() {
  try {
    const jobs = await api('GET', '/api/jobs');
    _latestJobs = jobs;  // ★ 缓存最新 job 列表,供日志面板连接 WS 时定位 running job_id
    if (!jobs.length) { $('jobs').innerHTML = '<p class="empty">暂无历史</p>'; return; }
    const stateLabel = { running: '运行中', completing: '收尾中', done: '✅ 已完成',
                         timed_out: '⏰ 超时', abnormal_exit: '💥 游戏异常退出', failed: '❌ 失败', aborted: '🚫 已中止' };
    const fmtDuration = (sec) => {
      sec = Math.max(0, Math.floor(sec || 0));
      const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
      if (h) return `${h}h ${m}m ${s}s`;
      if (m) return `${m}m ${s}s`;
      return `${s}s`;
    };
    const fmtTime = (ts) => {
      if (!ts) return '–';
      const d = new Date(ts * 1000);
      return d.toLocaleTimeString('zh-CN', { hour12: false });
    };
    $('jobs').innerHTML = jobs.map(j => {
      // 任务的显示名：优先 NAS 端记录的 display_name(如「挖矿」)，否则用 task_id
      const displayName = j.display_name || j.task_id;
      const startedAt = j.created_at ? fmtTime(j.created_at) : '–';
      const finishedAt = j.finished_at ? fmtTime(j.finished_at) : (j.state === 'running' ? '进行中' : '–');
      const elapsedSec = (j.created_at && j.finished_at) ? (j.finished_at - j.created_at)
                      : (j.elapsed || null);
      const elapsedTxt = elapsedSec != null ? fmtDuration(elapsedSec)
                       : (j.state === 'running' ? '进行中…' : '–');
      return `<div class="job-row">
        <span class="tag ${j.state}">${stateLabel[j.state] || j.state}</span>
        <div class="meta">
          <div class="sub job-field"><span class="job-field-label">任务ID</span><span class="job-field-val">${j.task_id}</span></div>
          <div class="sub job-field"><span class="job-field-label">任务名称</span><span class="job-field-val job-field-name">${displayName}</span></div>
          <div class="sub job-field"><span class="job-field-label">运行ID</span><span class="job-field-val_mono"><code>${j.job_id}</code></span></div>
          <div class="sub job-timer">⏱ 用时 <strong>${elapsedTxt}</strong> · 开始 ${startedAt} · 结束 ${finishedAt}</div>
        </div>
      </div>`;
    }).join('');
    // ★ 页面刷新后,若有仍在运行/收尾的单活 job,自动恢复轮询 + WS 日志
    resumeActiveJob(jobs);
  } catch (e) { $('jobs').innerHTML = `<p class="alert err">加载失败：${e.message}</p>`; }
}
$('btn-load-jobs').onclick = loadJobs;

// 单活 job 恢复:页面刷新/NAS 重启后重建轮询 + WS 日志面板
function resumeActiveJob(jobs) {
  const live = jobs.find(j => (j.state === 'running' || j.state === 'completing') && !j.finished_at);
  if (!live) return;
  const stateText = { running: '运行中', completing: '收尾中（可中止）' };
  setRunStatus(live.state, stateText[live.state] || live.state, live.display_name || '');
  // 还原真实开始时长(created_at 秒 → 毫秒),避免刷新后计时归零
  const startedMs = live.created_at ? live.created_at * 1000 : Date.now();
  setJobMeta(`任务ID <code>${live.job_id}</code> · 恢复监视`);
  // 已连着同一个 job 时不重复连接(避免刷新历史清空缓冲 + 重连闪烁)
  if (_liveJobId === live.job_id && _liveWs && _liveWs.readyState === WebSocket.OPEN) return;
  showLiveLog(live.job_id);
  appendLiveLine('[系统] 页面已刷新,恢复实时日志同步…');
  connectLogWS(live.job_id);
  pollStatus(live.job_id, startedMs);
}

// ============================================================
// ★ 实时日志面板：浏览器直连 Windows listener WS(单活 job) ★
// ============================================================
let _winHost = null;      // {ip, port}，由配对信息注入
let _liveWs = null;       // 当前 job 的 WebSocket
let _liveJobId = null;    // 当前 job_id
let _liveLines = 0;       // 已收行数
let _scrollPaused = false; // 用户向上滚动时暂停自动跟进

function _w() { return _winHost || { ip: null, port: 8766 }; }

/** 配对成功后注入 Windows 主机信息。 */
function setLogTarget(ip, port) {
  _winHost = { ip, port: port || 8766 };
}

/** 显示日志面板 + 重置计数。 */
function showLiveLog(jobId) {
  _liveJobId = jobId;
  _liveLines = 0;
  _scrollPaused = false;
  $('ll-jobid').textContent = '#' + jobId;
  $('ll-count').textContent = '0 行';
  $('ll-reason').hidden = true;
  $('ll-pre').innerHTML = '';
  $('live-log').hidden = false;
}

/** 隐藏日志面板。 */
function hideLiveLog() {
  $('live-log').hidden = true;
}

// 用户手动滚底 → 恢复自动跟进
$('ll-pre').addEventListener('scroll', (e) => {
  const el = e.target;
  _scrollPaused = (el.scrollHeight - el.scrollTop - el.clientHeight) > 40;
});

function setLiveWs(state, text) {
  const dot = $('ll-dot'); dot.className = 'ws-dot ' + state;
  $('ll-status').textContent = text;
}
function setLiveReason(text, cls) {
  const el = $('ll-reason');
  if (!text) { el.hidden = true; return; }
  el.textContent = text; el.className = 'live-log-reason ' + (cls || '');
  el.hidden = false;
}

function appendLiveLine(raw) {
  const pre = $('ll-pre');
  const line = document.createElement('span');
  line.className = 'log-line';
  // 行内高亮:完成关键字 / 异常(不污染,仅着色)
  const t = raw || '';
  if (/任务结束/.test(t)) { line.className += ' kw'; line.textContent = '★ ' + t; }
  else if (/失败|异常|错误|error|exception|闪退|fatal/i.test(t)) { line.className += ' err'; line.textContent = t; }
  else { line.textContent = t; }
  pre.appendChild(line);
  _liveLines++;
  // 缓冲上限 400 行
  while (pre.children.length > 400) pre.removeChild(pre.firstChild);
  $('ll-count').textContent = _liveLines + ' 行';
  if (!_scrollPaused) pre.scrollTop = pre.scrollHeight;
}

/** 建立 WS 连接(server 先推 recent(3) 历史,再推新行,终态推 {last}+state 后关闭)。 */
function connectLogWS(jobId) {
  disconnectLogWS();
  const { ip, port } = _w();
  if (!ip) {
    setLiveWs('error', '未配对');
    appendLiveLine('⚠ 请先配对 Windows _listener,再查看日志');
    return;
  }
  setLiveWs('connecting', '连接中…');
  const url = `ws://${ip}:${port}/ws/logs/${jobId}`;
  let ws;
  try { ws = new WebSocket(url); } catch (e) { setLiveWs('error', '连接失败'); return; }
  _liveWs = ws;
  ws.onopen = () => setLiveWs('connected', '实时同步中');
  ws.onmessage = (ev) => {
    let msg; try { msg = JSON.parse(ev.data); } catch { return; }
    if (msg.error) { appendLiveLine('⚠ ' + msg.error); return; }
    if (Array.isArray(msg.lines)) msg.lines.forEach(appendLiveLine);
    if (msg.state) {
      const s = msg.state.state || msg.state;
      const reasonMap = { game_exited:'游戏退出', log_keyword:'日志关键字命中', timeout:'超时', error:'执行错误' };
      const reasonText = msg.state.completion_reason ? (reasonMap[msg.state.completion_reason] || msg.state.completion_reason) : '';
      const stateZh = { done:'✅ 已完成', timed_out:'⏰ 超时', abnormal_exit:'💥 游戏异常退出', failed:'❌ 失败', aborted:'🚫 已中止', completing:'收尾中' };
      if (stateZh[s]) setLiveReason(stateZh[s] + (reasonText ? ' · ' + reasonText : ''), s === 'done' ? 'ok' : 'err');
    }
    if (msg.last) { setLiveWs('closed', '已结束'); ws.close(); }
  };
  ws.onerror = () => setLiveWs('error', '连接错误');
  ws.onclose = () => { if (_liveWs === ws) _liveWs = null; };
}

function disconnectLogWS() {
  if (_liveWs) { try { _liveWs.close(); } catch {} _liveWs = null; }
}

/** 中止任务(仅在 completing 反悔窗口有效)。 */
async function abortJob() {
  if (!_liveJobId) return;
  try {
    const r = await api('POST', '/api/abort');
    appendLiveLine('[系统] 已发送中止请求' + (r.aborted ? ' ✓' : ''));
  } catch (e) { appendLiveLine('[系统] 中止失败: ' + e.message); }
}
$('btn-abort').onclick = abortJob;

let _latestJobs = [];
// ▲ loadJobs 时缓存最新 job 列表

// 初始化
setRunStatus('idle', '空闲', '等待任务触发');
setJobMeta(null);
hideLiveLog();
refreshTarget().then(() => { if ($('btn-unpair').hidden === false) loadTasks(); });
loadJobs();
</script>
